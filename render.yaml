services:
  # NestJS Backend API
  - type: web
    name: seapunk-api
    runtime: node
    region: oregon
    plan: free
    branch: develop
    buildCommand: npm install && npx prisma generate --schema=apps/backend-rest/prisma/schema.prisma && npx prisma migrate deploy --schema=apps/backend-rest/prisma/schema.prisma && npm run backend:build
    startCommand: cd apps/backend-rest && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: seapunk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
    healthCheckPath: /api

databases:
  # PostgreSQL Database
  - name: seapunk-db
    databaseName: seapunk_manager
    user: seapunk_user
    region: oregon
    plan: free
    ipAllowList: []
